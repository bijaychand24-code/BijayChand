name: Deploy to AWS EC2 (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build on runner and deploy containers on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image names
        id: images
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          PREFIX="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${REPO,,}"
          echo "api=${PREFIX}-api" >> "$GITHUB_OUTPUT"
          echo "client=${PREFIX}-client" >> "$GITHUB_OUTPUT"

      - name: Validate EC2 secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          for SECRET in EC2_HOST EC2_USER EC2_TARGET_DIR EC2_SSH_KEY; do
            if [ -z "${!SECRET}" ]; then
              echo "ERROR: $SECRET secret is missing"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.images.outputs.client }}:latest
            ${{ steps.images.outputs.client }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check EC2 disk space
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "df -h; echo; df -i; echo; docker system df || true"

      - name: Free disk space on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<'EOF'
            set -e
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true
            docker system df || true
            df -h
          EOF

      - name: Sync repository to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_TARGET_DIR'"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_TARGET_DIR/"

      - name: Pull images and start containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          CLIENT_IMAGE: ${{ steps.images.outputs.client }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
            set -e
            cd '$EC2_TARGET_DIR'

            if [ ! -f server/.env ]; then
              cp server/.env.example server/.env
              echo "WARNING: server/.env was missing; created it from .env.example."
              echo "Edit it on the server to configure SMTP/PostgreSQL/CORS."
            fi

            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
            export SERVER_IMAGE='$API_IMAGE:latest'
            export CLIENT_IMAGE='$CLIENT_IMAGE:latest'

            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f
          EOF

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
            set -e
            cd '$EC2_TARGET_DIR'
            docker compose ps

            for i in \$(seq 1 12); do
              if docker compose exec -T client wget -q -O- http://localhost/api/health | grep -q '"status":"ok"'; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for app to become healthy (\$i/12)..."
              sleep 5
            done

            echo "Health check failed. Recent logs:"
            docker compose logs --tail=100
            exit 1
          EOF
