
name: Bijay Chand - EC2 Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files to EC2
        run: |
          rsync -avz \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_TARGET_DIR }}/
- name: Restart Nginx
  run: |
    ssh -i ~/.ssh/ec2_key \
      ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
      "sudo systemctl restart nginx && sudo systemctl is-active nginx"

- name: Verify website
  run: |
    curl -f --retry 5 --retry-delay 5 \
      http://${{ secrets.EC2_HOST }}/
