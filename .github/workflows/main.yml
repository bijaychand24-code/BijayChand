
name: Bijay Chand EC2 Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure SSH private key
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      # Step 3: Validate required secrets
      - name: Validate EC2 secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: EC2_HOST secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "ERROR: EC2_USER secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_TARGET_DIR }}" ]; then
            echo "ERROR: EC2_TARGET_DIR secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing"
            exit 1
          fi

          echo "All required EC2 secrets are configured."

      # Step 4: Add EC2 host to known_hosts
      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Step 5: Test SSH connection
      - name: Test EC2 SSH connection
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "echo 'SSH connection successful'"

      # Step 6: Deploy website files to EC2
      - name: Deploy files to EC2
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes" \
            ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_TARGET_DIR }}/

      # Step 7: Verify Nginx service
      - name: Verify Nginx
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl is-active nginx"
