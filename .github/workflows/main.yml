name: Deploy to AWS EC2 (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy containers on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate EC2 secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          for SECRET in EC2_HOST EC2_USER EC2_TARGET_DIR EC2_SSH_KEY; do
            if [ -z "${!SECRET}" ]; then
              echo "ERROR: $SECRET secret is missing"
              exit 1
            fi
          done

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync repository to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_TARGET_DIR'"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_TARGET_DIR/"

      - name: Build and start containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
            set -e
            cd '$EC2_TARGET_DIR'

            if [ ! -f server/.env ]; then
              cp server/.env.example server/.env
              echo "WARNING: server/.env was missing; created it from .env.example."
              echo "Edit it on the server to configure SMTP/MongoDB/CORS."
            fi

            docker compose up -d --build --remove-orphans
            docker image prune -f
          EOF

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
            set -e
            cd '$EC2_TARGET_DIR'
            docker compose ps

            for i in \$(seq 1 12); do
              if docker compose exec -T client wget -q -O- http://localhost/api/health | grep -q '"status":"ok"'; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for app to become healthy (\$i/12)..."
              sleep 5
            done

            echo "Health check failed. Recent logs:"
            docker compose logs --tail=100
            exit 1
          EOF
